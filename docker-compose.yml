services:

  user-db:
    image: mongo:7
    container_name: user-db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: user_db
    volumes:
      - user-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: mysql:8.0
    container_name: product-db
    restart: always
    ports:



      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: product_db
    volumes:
      - product-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-db:
    image: mysql:8.0
    container_name: order-db
    restart: always
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: order_db
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user
      dockerfile: Dockerfile
    container_name: user-service
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://user-db:27017/user_db
    depends_on:
      user-db:
        condition: service_healthy

  product-service:
    build:
      context: ./product
      dockerfile: Dockerfile
    container_name: product-service
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      DB_HOST: product-db
      DB_PORT: 3306
      DB_NAME: product_db
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      product-db:
        condition: service_healthy

  order-service:
    build:
      context: ./order
      dockerfile: Dockerfile
    container_name: order-service
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      DB_HOST: order-db
      DB_PORT: 3306
      DB_NAME: order_db
      DB_USER: root
      DB_PASSWORD: root
    depends_on:
      order-db:
        condition: service_healthy

volumes:
  user-db-data:
  product-db-data:
  order-db-data: